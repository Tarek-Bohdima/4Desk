# 4desk quality gates — required for every PR (branch protection on main).
# Scoped to 4desk-owned code so upstream-merge PRs stay tractable; upstream code
# is linted by upstream. Full-crate clippy lands once CI has cached vcpkg deps.
name: 4desk CI

on:
  # All PRs, regardless of base — stacked PRs (base = another feature branch)
  # need the required gates to report too, or the stack can never merge.
  pull_request:
  push:
    branches: ["main"]

jobs:
  # Doc-only changes skip the expensive gates. Skipped required checks still
  # satisfy branch protection, so doc PRs stay mergeable — never use
  # paths-ignore on required checks (they'd hang forever).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '!(docs/**|**/*.md)'

  rust-gates:
    name: rust-gates
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/hbb_common
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: fmt (4desk-owned Rust)
        # rustfmt directly on our files — `cargo fmt -- <files>` still checks
        # the whole crate, and upstream code is not rustfmt-clean.
        run: |
          if [ -d src/four_desk ]; then rustfmt --check --edition 2021 $(find src/four_desk -name '*.rs'); fi
      - name: hbb_common check + clippy + tests
        working-directory: libs/hbb_common
        run: |
          cargo check
          cargo clippy -- -D warnings || echo "::warning::clippy not yet clean on forked hbb_common (upstream baseline); failing lints tracked in issue #5"
          cargo test

  flutter-gates:
    name: flutter-gates
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin to the Flutter version the committed sources target (upstream
          # 1.4.9 baseline); newer Flutter renames ThemeData APIs and breaks
          # package-wide compilation.
          flutter-version: "3.24.5"
      - name: dart format (4desk-owned Dart)
        working-directory: flutter
        run: |
          if [ -d lib/four_desk ]; then dart format --set-exit-if-changed lib/four_desk; fi
          if [ -d test/four_desk ]; then dart format --set-exit-if-changed test/four_desk; fi
      - name: dart analyze (4desk-owned Dart)
        working-directory: flutter
        # dart analyze (not flutter analyze): path-scoped, doesn't require the
        # flutter_rust_bridge codegen output that only exists after bridge gen.
        run: |
          flutter pub get
          if [ -d lib/four_desk ]; then dart analyze lib/four_desk; fi
          if [ -d test/four_desk ]; then dart analyze test/four_desk; fi
      - name: flutter tests (4desk-owned)
        working-directory: flutter
        run: |
          if [ -d test/four_desk ]; then flutter test test/four_desk; else echo "no 4desk tests yet"; fi
